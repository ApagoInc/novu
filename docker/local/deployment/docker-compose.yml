version: '3.9'
services:
  redis:
    image: 'redis:alpine'
    container_name: redis
    restart: unless-stopped
    logging:
      driver: 'none'
  mongodb:
    image: mongo
    command: 
      - --quiet
      - '--logpath'
      - '/var/log/mongodb/mongod.log'
    container_name: mongodb
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - mongodb:/data/db
    ports:
      - 27017:27017
  api:
    image: 'novu-api'
    depends_on:
      - mongodb
      - redis
    container_name: api
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
    env_file: 
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      API_ROOT_URL: ${API_ROOT_URL}
      DISABLE_USER_REGISTRATION: ${DISABLE_USER_REGISTRATION}
      PORT: ${API_PORT}
      FRONT_BASE_URL: ${FRONT_BASE_URL}
      MONGO_URL: ${MONGO_URL}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: ${REDIS_CACHE_SERVICE_HOST}
      REDIS_CACHE_SERVICE_PORT: ${REDIS_CACHE_SERVICE_PORT}
      S3_LOCAL_STACK: ${S3_LOCAL_STACK}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      JWT_SECRET: ${JWT_SECRET}
      STORE_ENCRYPTION_KEY: ${STORE_ENCRYPTION_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      API_CONTEXT_PATH: ${API_CONTEXT_PATH}
      # Important custom fields for our implementation
      LAKESIDE_API: ${LAKESIDE_API}
      LAKESIDE_EMAIL: ${LAKESIDE_EMAIL}
      LAKESIDE_PASSWORD: ${LAKESIDE_PASSWORD}
      RUN_ON_HTTP: true
      API_OVERRIDE_KEY: ${API_OVERRIDE_KEY}
      EMAIL_WHITELIST: ${EMAIL_WHITELIST}
      EMAIL_TEMPLATES_DIR_API_CONTAINER_PATH: ${EMAIL_TEMPLATES_DIR_API_CONTAINER_PATH}
    ports:
      - '${API_PORT}:${API_PORT}'
  worker:
    image: 'novu-worker'
    depends_on:
      - mongodb
      - redis
    container_name: worker
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
    environment:
      NODE_ENV: ${NODE_ENV}
      MONGO_URL: ${MONGO_URL}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: ${REDIS_CACHE_SERVICE_HOST}
      REDIS_CACHE_SERVICE_PORT: ${REDIS_CACHE_SERVICE_PORT}
      S3_LOCAL_STACK: ${S3_LOCAL_STACK}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      STORE_ENCRYPTION_KEY: ${STORE_ENCRYPTION_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
  ws:
    image: 'novu-ws'
    depends_on:
      - mongodb
      - redis
    container_name: ws
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
    environment:
      PORT: ${WS_PORT}
      NODE_ENV: ${NODE_ENV}
      MONGO_URL: ${MONGO_URL}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WS_CONTEXT_PATH: ${WS_CONTEXT_PATH}
      RUN_ON_HTTP: true
    ports:
      - '3002:3002'
  web:
    image: 'novu-web'
    depends_on:
      - api
      - worker
    container_name: web
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
    env_file: 
      - .env
    environment:
      MY_HOST: ${PROXY_HOST}
      REACT_APP_API_URL: ${API_ROOT_URL}
      REACT_APP_ENVIRONMENT: ${NODE_ENV}
      REACT_APP_WIDGET_EMBED_PATH: ${WIDGET_EMBED_PATH}
      REACT_APP_DOCKER_HOSTED_ENV: 'true'
      REACT_APP_WS_URL: ${REACT_APP_WS_URL}
      FRONT_BASE_URL: ${FRONT_BASE_URL}
      FRONT_BASE_CONTEXT_PATH: ${FRONT_BASE_CONTEXT_PATH}
    ports:
      - 4200:4200
    volumes:
       - /home/ec2-user/novu/apps/web:/usr/src/app/apps/web
       - /usr/src/app/apps/web/node_modules
  
  proxy:
    container_name: proxy
    build:
      context: ../../../apps/proxy
      dockerfile: ./Dockerfile
      args:
        NGINX_HOST: ${PROXY_HOST}
        NGINX_PORT: "443"
        HOST_NAME: ${HOST_NAME}
        PROXY_HOST: ${PROXY_HOST}
        HTTPS_CERT_OS_PATH: ${HTTPS_CERT_OS_PATH}
        HTTPS_KEY_OS_PATH: ${HTTPS_KEY_OS_PATH}
    image: nginx:1.27.3-alpine
    # volumes:
      # Could use this bind mount to monitor logs on the host machine, i.e. with fail2ban or similar
      # But this removes the log stream to docker compose, so that would have to be accepted or resolved somehow
      # - type: bind
        # source: ${NGINX_LOG_MOUNT_HOST_DIR}
        # target: /var/log/nginx/
    ports:
    # host:container
    - "443:443"
    restart: unless-stopped
    env_file: 
      - .env
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
volumes:
  mongodb: ~
