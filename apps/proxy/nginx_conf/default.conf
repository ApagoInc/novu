# user nginx;
# worker_processes auto;
# error_log /var/log/nginx/error.log notice;
# pid /run/nginx.pid;

# # Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
# include /usr/share/nginx/modules/*.conf;

# events {
#     worker_connections 1024;
# }

# NOTE:
# The nginx docker container injects this conf into an http block.


# Some edits made from reference:
# https://github.com/trimstray/nginx-admins-handbook/blob/master/doc/RULES.md#beginner-reject-unsafe-http-methods

# Hide some standard response headers:
proxy_hide_header X-Powered-By;
proxy_hide_header X-AspNetMvc-Version;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-Drupal-Cache;

# Hide some Amazon S3 specific response headers:
proxy_hide_header X-Amz-Id-2;
proxy_hide_header X-Amz-Request-Id;

# Hide other risky response headers:
proxy_hide_header X-Runtime;

# Remove risky request headers (the safest method):
proxy_set_header X-Original-URL "";
proxy_set_header X-Rewrite-URL "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Host "";

add_header Feature-Policy "geolocation 'none'; midi 'none'; notifications 'none'; push 'none'; sync-xhr 'none'; microphone 'none'; camera 'none'; magnetometer 'none'; gyroscope 'none'; speaker 'none'; vibrate 'none'; fullscreen 'none'; payment 'none'; usb 'none';";

server_tokens off;

# 

    error_log /var/log/nginx/error.log info;
    # access_log /var/log/nginx/access.log;
# http {
    # Rate limit
    # For a given IP, allow up to 10 requests per second
    limit_req_zone $binary_remote_addr zone=deny_rules:10m rate=10r/s;
    limit_req_log_level notice;
    limit_req_status 429;

    # log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                   '$status $body_bytes_sent "$http_referer" '
    #                   '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # sendfile            on;
    tcp_nopush          on;
    # keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    # default_type        application/octet-stream;

    ##buffer policy
    client_body_buffer_size 1K;
    client_header_buffer_size 1k;
    client_max_body_size 1m;
    large_client_header_buffers 2 1k;
    ##end buffer policy



    # 
    # Use a map to check User-Agent headers
    map $http_user_agent $blocked_user_agent {
        default 0;
        "~*curl" 1;
        "~*wget" 1;
        "~*bot" 1;
        "~*spider" 1;
        "~*crawl" 1;
        "~*Custom-AsyncHttpClient" 1;
        "~*Cpanel-HTTP-Client/1.0" 1;
    }
  

    server {


        location ~ \.php$ {
            limit_req zone=deny_rules nodelay;
            # If fail2ban is added, we could then automatically jail any users caught by this rate limiter
            # By adding an additional setting in the fail2ban setup (reference https://www.loopwerk.io/articles/2024/hardening-web-server/)
            deny all;
        }

        # 
        # Block specific file extensions
        location ~* \.(php|env|ini|log|sql|conf|bak|old|sh|yml)$ {
            # return 403;
            limit_req zone=deny_rules nodelay;
            deny all;
        }

        # Block WordPress requests
        location ~* /(wp-admin|wp-login|wp-content|wp-includes)/ {
            # return 403;
            limit_req zone=deny_rules nodelay;
            deny all;
        }

        # Block HEAD and TRACE requests
        if ($request_method ~* (HEAD|TRACE)) {
            return 403;
            # limit_req zone=deny_rules nodelay;
            # deny all;
        }

        # Block malicious User-Agents
        if ($blocked_user_agent) {
            return 403;
            # limit_req zone=deny_rules nodelay;
            # deny all;
        }

        # Limit the size of POST requests
        # client_max_body_size 1M;
        # 




        # TODO - keep only the address:port pair for the listen directive?
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        # Variable for below: $hostname?
        server_name  ${HOST_NAME};
        root         /usr/share/nginx/html;


        # We really want to only allow requests to
        # /
        # /web
        # /api
        # /ws

        # And for the requests to /, we will ONLY allow a request to the exact root - which is just essentially a redirect to the admin web frontend.

    # For any initial request that is exactly to the root, redirect to web.
	location = / {

            # localhost
		    proxy_pass http://web:4200;
            # return 301 ${PROXY_HOST}/web;

	}

    location /web {

            # localhost
		    proxy_pass http://web:4200;

    }

    location /api {

            # localhost
            proxy_pass http://api:3000;

    }

    location /ws {
            # localhost
            proxy_pass http://ws:3002;

		    # allow websocket traffic to be proxied.
		    proxy_http_version 1.1;
		    proxy_set_header Upgrade $http_upgrade;
		    proxy_set_header Connection "Upgrade";
		    proxy_set_header Host $host;
    }

    location /socket.io/ {
            proxy_pass http://ws:3002;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
    }

    location / {
        
        # Don't even respond to any requests at the root that aren't explicitly just for the root.
        return 444;
    }

        ssl_certificate "/etc/pki/nginx/server.cert";
	# ssl_certificate "/home/ec2-user/https_certs/novu-apagocloud-dot-net/server.cert";

        ssl_certificate_key "/etc/pki/nginx/private/server.key";
	# ssl_certificate_key "/home/ec2-user/https_certs/novu-apagocloud-dot-net/server.key";
	
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;

        ssl_protocols TLSv1.3 TLSv1.2;
        # ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        
        error_page 404 /404.html;
        location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }
